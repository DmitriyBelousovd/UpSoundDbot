services:
  - type: web
    name: upsound-yandex-track-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.main
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: REQUEST_TIMEOUT_SECONDS
        value: "10"
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_PATH
        value: "/tg/webhook"
